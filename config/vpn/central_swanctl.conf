connections {
    central-to-site-alpha {
        version = 2
        local_addrs = 198.51.100.1
        remote_addrs = 198.51.100.2

        proposals = aes256gcm16-prfsha384-ecp384, aes256-sha384-modp3072, aes256-sha256-modp2048

        local {
            auth = psk
            id = @central.telerad.health.local
        }
        remote {
            auth = psk
            id = @remote.telerad.health.local
        }

        children {
            telerad-dicom-tunnel {
                local_ts = 10.200.20.0/24
                remote_ts = 10.100.10.0/24

                esp_proposals = aes256gcm16-ecp384, aes256-sha256-modp2048
                
                rekey_time = 3600s
                life_time = 7200s
                
                mode = tunnel
                
                start_action = trap
                close_action = restart
                dpd_action = restart
            }
        }

        dpd_delay = 30s
        dpd_timeout = 120s
        rekey_time = 28800s
    }
}
