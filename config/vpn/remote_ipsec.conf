config setup
    charondebug="ike 2, knl 2, cfg 2, net 1, esp 2, dpy 1"
    uniqueids=yes

conn %default
    keyexchange=ikev2
    auto=start
    type=tunnel
    compress=no
    mobike=no

conn site-alpha-to-central
    left=198.51.100.2
    leftid=@remote.telerad.health.local
    leftsubnet=10.100.10.0/24
    leftfirewall=yes

    right=198.51.100.1
    rightid=@central.telerad.health.local
    rightsubnet=10.200.20.0/24

    ike=aes256gcm16-prfsha384-ecp384,aes256-sha384-modp3072!
    esp=aes256gcm16-ecp384,aes256-sha256!

    authby=secret
    keylife=3600s
    ikelifetime=28800s
    rekeymargin=540s
    rekeyfuzz=100%

    dpdaction=restart
    dpddelay=30s
    dpdtimeout=120s
