# ==============================================================================
# DCMTK storescp Configuration File: High-Performance Storage SCP
# Usage: storescp -f -c config/dicom/dcmtk_storescp.cfg CENTRAL_PACS 4242
# ==============================================================================

[[TransferSyntaxes]]
SymbolicName = UncompressedOnly
TransferSyntax1 = 1.2.840.10008.1.2.1   # Explicit VR Little Endian
TransferSyntax2 = 1.2.840.10008.1.2     # Implicit VR Little Endian

[[TransferSyntaxes]]
SymbolicName = LosslessCompression
TransferSyntax1 = 1.2.840.10008.1.2.4.70 # JPEG Lossless
TransferSyntax2 = 1.2.840.10008.1.2.4.90 # JPEG 2000 Part 1 Lossless
TransferSyntax3 = 1.2.840.10008.1.2.1    # Explicit VR Little Endian
TransferSyntax4 = 1.2.840.10008.1.2      # Implicit VR Little Endian

[[PresentationContexts]]
SymbolicName = TeleradiologyContexts
# Verification SOP Class
PresentationContext1 = 1.2.840.10008.1.1 \ UncompressedOnly
# CT Image Storage
PresentationContext2 = 1.2.840.10008.5.1.4.1.1.2 \ LosslessCompression
# MR Image Storage
PresentationContext3 = 1.2.840.10008.5.1.4.1.1.4 \ LosslessCompression
# CR Image Storage
PresentationContext4 = 1.2.840.10008.5.1.4.1.1.1 \ LosslessCompression
# Digital X-Ray Image Storage
PresentationContext5 = 1.2.840.10008.5.1.4.1.1.1.1 \ LosslessCompression
# Secondary Capture Storage
PresentationContext6 = 1.2.840.10008.5.1.4.1.1.7 \ UncompressedOnly

# Profile Mapping for Central PACS
[[Profiles]]
SymbolicName = CENTRAL_PACS_PROFILE
PresentationContexts = TeleradiologyContexts
MaximumPDU = 65536
